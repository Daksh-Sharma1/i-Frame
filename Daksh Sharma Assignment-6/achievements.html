    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            height: 800px;
            background: linear-gradient(45deg,rgb(162, 0, 255), orange);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        ul{
            list-style-type: none;
            display: flex;
            height: 10%;
            width: 80%;
            background-color: blanchedalmond;
            border-radius: 50px;
            align-items: center;
            justify-content: space-evenly;
        }
        a{
            color: black;
            text-decoration: none;
            text-transform: capitalize;
            font-size:x-large;
        }
        li:hover{
            transform: scale(1.05);
            text-decoration: underline 1px black;
        }
    </style>
</head>
