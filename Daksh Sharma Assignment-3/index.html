<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
            text-align: center;
        }
        .container{
            height: 600px;
            border: 1px solid black;
            color: white;
        }
        .header, .footer{
            height: 20%;
            background-color:brown;
        }
        .center{
            height: 60%;
            background-color: blanchedalmond;
            display: flex;
        }
        .left{
            height: 100%;
            width: 25%;
            background-color:cadetblue;
        }
        .right{
            height: 100%;
            width: 75%;
            background-color:gray;
        }
        .top{
            height: 50%;
            background-color: darkcyan;
        }
        .bottem{
            height: 50%;
            background-color: aquamarine;
            display: flex;
        }
        .r1{
            height: 100%;
            width: 50%;
            background-color:burlywood;
        }
         .r2{
            height: 100%;
            width: 50%;
            background-color:chocolate;
        }
    </style>
</head>
<body>
    <h1>Flex Box</h1>
    <div class="container">
        <div class="header"><h1>Header</h1></div>
        <div class="center">
        <div class="left"><h1>Left</h1></div>
        <div class="right">
        <div class="top"><h1>Top</h1></div>
        <div class="bottem">
        <div class="r1"> <h1>r1</h1></div>
        <div class="r2"><h1>r2</h1></div>
        </div>
        </div>
        </div>
        </body>
        <div class="footer"><h1>Footer</h1></div>
    </div>
</body>
</html>
